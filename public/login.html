<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Sign in — Azad Goods Transport</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #182236; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px;
  }
  .card { background: #fff; border-radius: 8px; padding: 32px 28px; width: 100%; max-width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .badge { width: 44px; height: 44px; border-radius: 50%; background: #F2EFE5; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  h1 { font-size: 17px; font-weight: 600; text-align: center; color: #182236; margin: 0; }
  .sub { font-size: 10.5px; color: #AD7A2F; letter-spacing: 2px; text-align: center; margin: 2px 0 20px; }
  label { display: block; font-size: 12px; color: #6B6656; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #D6D0BF; border-radius: 5px; font-size: 14px; margin-bottom: 14px; }
  button { width: 100%; padding: 10px 12px; border: none; border-radius: 5px; background: #182236; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #C7BFAE; cursor: default; }
  .err { background: #FBEAE7; color: #9C3B2E; font-size: 12.5px; border-radius: 5px; padding: 8px 10px; margin-bottom: 14px; display: none; }
  .note { font-size: 11px; color: #8A8574; text-align: center; margin-top: 16px; margin-bottom: 0; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="badge">🔒</div>
    <h1>AZAD GOODS</h1>
    <div class="sub">TRANSPORT COMPANY</div>

    <label for="pw">Owner password</label>
    <input id="pw" type="password" placeholder="••••••••" autofocus autocomplete="current-password" />

    <div class="err" id="err"></div>

    <button id="submitBtn" type="submit">Log in</button>

    <p class="note">Owner access only. This is a standalone login page — use it any time the main app doesn't show the password screen on its own.</p>
  </form>

  <script>
    var form = document.getElementById('loginForm');
    var pw = document.getElementById('pw');
    var err = document.getElementById('err');
    var btn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var password = pw.value;
      if (!password) return;
      btn.disabled = true;
      btn.textContent = 'Checking…';
      err.style.display = 'none';

      fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password }),
        cache: 'no-store',
      })
        .then(function (res) {
          return res.json().then(function (body) { return { ok: res.ok, body: body }; });
        })
        .then(function (result) {
          if (!result.ok) throw new Error((result.body && result.body.error) || 'Login failed.');
          // Same sessionStorage key the React app looks for (src/auth.js).
          sessionStorage.setItem('azad-transport-session', result.body.token);
          window.location.href = '/';
        })
        .catch(function (e2) {
          err.textContent = e2.message || 'Login failed.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Log in';
        });
    });
  </script>
</body>
</html>
